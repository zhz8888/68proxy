name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 打包验证：与 release.yml 相同的构建矩阵与资产准备流程，
  # 作为正式发版前的先锋测试，验证各平台能否正确产出产物（不发布 release）。
  # 注意：构建与资产准备步骤需与 .github/workflows/release.yml 保持同步。
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 钉住主版本：latest 会随上游跨主版本漂移，与 pnpm-lock.yaml 的
      # lockfileVersion 9.0 可能不兼容（--frozen-lockfile 会因此失败）
      - uses: pnpm/action-setup@v6
        with:
          version: '12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # CI 构建产物版本号用提交短哈希（semver 预发布格式），避免写死的 1.0.0
      # 混入测试包；tauri.conf.json 的 version 引用 package.json，构建后应用内
      # getVersion() 即返回 0.0.0-<sha>（侧栏显示 v0.0.0-<sha>）。
      # 不能用纯哈希：Tauri CLI 要求 version 为合法 semver 字符串。
      - name: Sync app version from commit SHA
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short HEAD)"
          npm pkg set version="0.0.0-${SHORT_SHA}"
          echo "CI 构建版本：$(node -p "require('./package.json').version")"

      - name: Frontend typecheck
        run: pnpm build

      # Windows：NSIS 安装版 + 便携 exe（与 release.yml 一致）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      # macOS：arm64 dmg + .app（与 release.yml 一致）
      # 必须同时指定 app：只构建 dmg 时 Tauri 会把中间产物 .app 清理掉，
      # 导致后续打包 .app.zip 找不到目录
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --bundles app,dmg --target aarch64-apple-darwin

      # 资产准备步骤与 release.yml 一致，产物命名以 ci-{sha} 前缀区分测试构建
      # Windows 资产：NSIS 安装包 + 便携 exe
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "ci-$($env:GITHUB_SHA.Substring(0,7))"  # 测试构建标识

          # 1) NSIS 安装包
          $nsis = Get-ChildItem -Path (Join-Path 'src-tauri/target/release/bundle/nsis' '*.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          $installerDest = "68Proxy-$VERSION-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path release-assets $installerDest)
          Write-Host "Installer copied: $installerDest"

          # 2) 便携版 exe（Tauri 便携版由 exe + portable.ini 组成，打包为 zip）
          $exePath = Join-Path 'src-tauri/target/release' '68Proxy.exe'
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/68Proxy-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# 68Proxy portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          # 压缩包必须落在 release-assets/ 内，否则会被后续 path: release-assets/* 漏掉
          $portableZip = "68Proxy-$VERSION-Windows-x64-Portable.zip"
          $portableZipPath = Join-Path 'release-assets' $portableZip
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZipPath -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: $portableZipPath"

          # 兜底校验：上传步骤只按目录收集，若产物写错位置会静默漏发（历史故障），
          # 这里显式确认两个 Windows 资产都已就位
          foreach ($asset in @($installerDest, $portableZip)) {
            if (-not (Test-Path (Join-Path 'release-assets' $asset))) {
              throw "Expected asset missing from release-assets: $asset"
            }
          }

      # macOS 资产：dmg 镜像 + .app 压缩包（与 release.yml 保持一致）
      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="ci-${GITHUB_SHA:0:7}"  # 测试构建标识
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1 || true)
          if [ -n "$DMG" ]; then
            NEW_DMG="68Proxy-${VERSION}-macOS-aarch64.dmg"
            cp "$DMG" "release-assets/$NEW_DMG"
            echo "✅ DMG copied: $NEW_DMG"
          else
            echo "No DMG found under $BUNDLE_DIR/dmg" >&2
            exit 1
          fi

          # .app 目录打包为 zip，顶层即 .app 本身，解压后可直接拖入「应用程序」
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app" | head -1 || true)
          if [ -n "$APP" ]; then
            NEW_APP_ZIP="68Proxy-${VERSION}-macOS-aarch64.app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/$NEW_APP_ZIP"
            echo "✅ app zip created: $NEW_APP_ZIP"
          else
            echo "No .app found under $BUNDLE_DIR/macos" >&2
            exit 1
          fi

      - name: Generate build summary
        shell: bash
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ runner.os }} (${{ matrix.arch || 'x86_64' }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Overall Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets/ >> $GITHUB_STEP_SUMMARY || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: test-bundles-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
