name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 打包验证：与 release.yml 相同的构建矩阵与资产准备流程，
  # 作为正式发版前的先锋测试，验证各平台能否正确产出产物（不发布 release）。
  # 注意：构建与资产准备步骤需与 .github/workflows/release.yml 保持同步。
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck
        run: pnpm build

      # Windows：NSIS 安装版 + 便携 exe（与 release.yml 一致）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      # macOS：arm64 dmg（与 release.yml 一致）
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --bundles dmg --target aarch64-apple-darwin

      # 资产准备步骤与 release.yml 一致，产物命名以 ci-{sha} 前缀区分测试构建
      # Windows 资产：NSIS 安装包 + 便携 exe
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "ci-$($env:GITHUB_SHA.Substring(0,7))"  # 测试构建标识

          # 1) NSIS 安装包
          $nsis = Get-ChildItem -Path (Join-Path 'src-tauri/target/release/bundle/nsis' '*.exe') -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          $installerDest = "68proxy-$VERSION-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path release-assets $installerDest)
          Write-Host "Installer copied: $installerDest"

          # 2) 便携版 exe（Tauri 便携版由 exe + portable.ini 组成，打包为 zip）
          $exePath = Join-Path 'src-tauri/target/release' '68proxy.exe'
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/68proxy-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# 68proxy portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          $portableZip = "68proxy-$VERSION-Windows-x64-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: $portableZip"

      # macOS 资产：dmg
      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="ci-${GITHUB_SHA:0:7}"  # 测试构建标识

          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1 || true)
          if [ -n "$DMG" ]; then
            NEW_DMG="68proxy-${VERSION}-macOS-aarch64.dmg"
            cp "$DMG" "release-assets/$NEW_DMG"
            echo "✅ DMG copied: $NEW_DMG"
          else
            echo "No DMG found under target/aarch64-apple-darwin/release/bundle/dmg" >&2
            exit 1
          fi

      - name: Generate build summary
        shell: bash
        run: |
          echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ runner.os }} (${{ matrix.arch || 'x86_64' }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Overall Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 产物" >> $GITHUB_STEP_SUMMARY
          ls -lh release-assets/ >> $GITHUB_STEP_SUMMARY || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-bundles-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
