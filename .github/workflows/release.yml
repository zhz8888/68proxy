name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 归一化版本 tag，作为后续构建与发布的唯一版本来源
  validate:
    runs-on: ubuntu-latest
    outputs:
      # 归一化结果：version 为纯语义化版本（如 1.2.1），tag 为规范 tag（如 v1.2.1）
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      # 剥离可选的 v/V 前缀后校验为合法 semver：重复 v 前缀、缺位、分支名等一律拒绝，
      # 避免把 vv1.2.1 之类的输入写进 package.json 并打进产物
      - name: Normalize version tag
        id: normalize
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#[vV]}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无效的版本 tag '${RAW_TAG}'：应形如 v1.2.1（v 前缀可省略）"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 68proxy 现状：Windows x64 + macOS arm64
          - os: windows-2022
          - os: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 用手动输入或触发 tag 归一化后的规范 tag 检出（v 前缀统一补齐）
          ref: ${{ needs.validate.outputs.tag }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 将已归一化的版本号写入 package.json，tauri.conf.json 引用它作为应用版本
      - name: Sync app version from tag
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      # 打包前的最后一道闸：确认 tauri.conf.json 实际读取到的版本就是归一化版本，
      # 防止 v/vv 前缀或意外改写混入安装包、dmg 与应用内显示的版本号
      - name: Verify app version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          SYNCED=$(node -p "require('./package.json').version")
          if [ "$SYNCED" != "$VERSION" ]; then
            echo "::error::package.json 版本 '${SYNCED}' 与归一化版本 '${VERSION}' 不一致"
            exit 1
          fi
          echo "待打包的应用版本：${SYNCED}"

      - name: Frontend typecheck
        run: pnpm build

      # Windows：NSIS 安装版 + 便携 exe（现状不变）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      # macOS：arm64 dmg（现状不变）
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --bundles dmg --target aarch64-apple-darwin

      # Windows 资产：NSIS 安装包 + 便携 exe
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ needs.validate.outputs.tag }}"  # 例如 v1.0.0
          $targetRoot = 'src-tauri/target/release'

          # 1) NSIS 安装包
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          $installerDest = "68proxy-$VERSION-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path release-assets $installerDest)
          Write-Host "Installer copied: $installerDest"

          # 2) 便携版 exe（Tauri 便携版由 exe + portable.ini 组成，打包为 zip）
          $exePath = Join-Path $targetRoot '68proxy.exe'
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/68proxy-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# 68proxy portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          $portableZip = "68proxy-$VERSION-Windows-x64-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: $portableZip"

      # macOS 资产：dmg（现状不变）
      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${{ needs.validate.outputs.tag }}"  # 例如 v1.0.0

          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1 || true)
          if [ -n "$DMG" ]; then
            NEW_DMG="68proxy-${VERSION}-macOS-aarch64.dmg"
            cp "$DMG" "release-assets/$NEW_DMG"
            echo "✅ DMG copied: $NEW_DMG"
          else
            echo "No DMG found under target/aarch64-apple-darwin/release/bundle/dmg" >&2
            exit 1
          fi

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, release]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      # 优先使用 release-notes/{tag}.md，缺失时回退到默认文案
      - name: Load release notes
        id: release_notes
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          NOTES_FILE="release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo 'body<<__RELEASE_NOTES__'
              cat "$NOTES_FILE"
              echo
              echo '__RELEASE_NOTES__'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<__RELEASE_NOTES__"
              echo "## 68proxy ${TAG}"
              echo
              echo "### 下载"
              echo "- **Windows (x86_64)**: \`68proxy-${TAG}-Windows-x64-setup.exe\`（NSIS 安装版）或 \`68proxy-${TAG}-Windows-x64-Portable.zip\`（绿色版）"
              echo "- **macOS (Apple Silicon / arm64)**: \`68proxy-${TAG}-macOS-aarch64.dmg\`。应用未签名与公证，首次打开请右键 →「打开」绕过 Gatekeeper，或在终端执行 \`sudo xattr -r -d com.apple.quarantine /Applications/68proxy.app\` 移除隔离属性"
              echo
              echo '### 使用前提'
              echo '- 需要 \`user_\` 开头的 Command Code API Key'
              echo '- 支持 OpenAI / Anthropic 兼容协议接入'
              echo '- 详见 [README](https://github.com/zhz8888/68proxy#readme)'
              echo
              echo '__RELEASE_NOTES__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: List downloaded release artifacts
        shell: bash
        run: ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: 68proxy ${{ needs.validate.outputs.tag }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
