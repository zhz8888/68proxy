name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 校验 tag 与 tauri.conf.json 中的版本一致，防止发布错版产物
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          # tauri.conf.json 的 version 指向 ../package.json，取 package.json 的实际版本
          VERSION=$(jq -r '.version' package.json)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches version
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED_TAG="v${{ steps.version.outputs.value }}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${EXPECTED_TAG}"
            exit 1
          fi

  release:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 68proxy 现状：Windows x64 + macOS arm64
          - os: windows-2022
          - os: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 将标签版本（去 v 前缀）写入 package.json，tauri.conf.json 引用它作为应用版本
      - name: Sync app version from tag
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${VERSION_TAG#v}"
        env:
          VERSION_TAG: ${{ inputs.tag || github.ref_name }}

      - name: Frontend typecheck
        run: pnpm build

      # Windows：NSIS 安装版 + 便携 exe（现状不变）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      # macOS：arm64 dmg（现状不变）
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --bundles dmg --target aarch64-apple-darwin

      # Windows 资产：NSIS 安装包 + 便携 exe
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ inputs.tag || github.ref_name }}"  # 例如 v1.0.0
          $targetRoot = 'src-tauri/target/release'

          # 1) NSIS 安装包
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          $installerDest = "68proxy-$VERSION-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path release-assets $installerDest)
          Write-Host "Installer copied: $installerDest"

          # 2) 便携版 exe（Tauri 便携版由 exe + portable.ini 组成，打包为 zip）
          $exePath = Join-Path $targetRoot '68proxy.exe'
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/68proxy-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# 68proxy portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          $portableZip = "68proxy-$VERSION-Windows-x64-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZip -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: $portableZip"

      # macOS 资产：dmg（现状不变）
      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${{ inputs.tag || github.ref_name }}"  # 例如 v1.0.0

          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1 || true)
          if [ -n "$DMG" ]; then
            NEW_DMG="68proxy-${VERSION}-macOS-aarch64.dmg"
            cp "$DMG" "release-assets/$NEW_DMG"
            echo "✅ DMG copied: $NEW_DMG"
          else
            echo "No DMG found under target/aarch64-apple-darwin/release/bundle/dmg" >&2
            exit 1
          fi

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      # 优先使用 release-notes/v{版本}.md，缺失时回退到默认文案
      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            {
              echo 'body<<__RELEASE_NOTES__'
              cat "$NOTES_FILE"
              echo
              echo '__RELEASE_NOTES__'
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<__RELEASE_NOTES__"
              echo "## 68proxy ${{ github.ref_name }}"
              echo
              echo "### 下载"
              echo "- **Windows (x86_64)**: \`68proxy-${{ github.ref_name }}-Windows-x64-setup.exe\`（NSIS 安装版）或 \`68proxy-${{ github.ref_name }}-Windows-x64-Portable.zip\`（绿色版）"
              echo "- **macOS (Apple Silicon / arm64)**: \`68proxy-${{ github.ref_name }}-macOS-aarch64.dmg\`。应用未签名与公证，首次打开请右键 →「打开」绕过 Gatekeeper，或在终端执行 \`sudo xattr -r -d com.apple.quarantine /Applications/68proxy.app\` 移除隔离属性"
              echo
              echo '### 使用前提'
              echo '- 需要 \`user_\` 开头的 Command Code API Key'
              echo '- 支持 OpenAI / Anthropic 兼容协议接入'
              echo '- 详见 [README](https://github.com/evanfu0110/68proxy#readme)'
              echo
              echo '__RELEASE_NOTES__'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: List downloaded release artifacts
        shell: bash
        run: ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 68proxy ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || true }}
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
