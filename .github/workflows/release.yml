name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 归一化版本 tag，作为后续构建与发布的唯一版本来源
  validate:
    runs-on: ubuntu-latest
    outputs:
      # 归一化结果：version 为纯语义化版本（如 1.2.1），tag 为规范 tag（如 v1.2.1）
      version: ${{ steps.normalize.outputs.version }}
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      # 剥离可选的 v/V 前缀后校验为合法 semver：重复 v 前缀、缺位、分支名等一律拒绝，
      # 避免把 vv1.2.1 之类的输入写进 package.json 并打进产物
      - name: Normalize version tag
        id: normalize
        shell: bash
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#[vV]}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无效的版本 tag '${RAW_TAG}'：应形如 v1.2.1（v 前缀可省略）"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  release:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 68Proxy 现状：Windows x64 + macOS arm64
          - os: windows-2022
          - os: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 用手动输入或触发 tag 归一化后的规范 tag 检出（v 前缀统一补齐）
          ref: ${{ needs.validate.outputs.tag }}

      # 钉住主版本：latest 会随上游跨主版本漂移，与 pnpm-lock.yaml 的
      # lockfileVersion 9.0 可能不兼容（--frozen-lockfile 会因此失败）
      - uses: pnpm/action-setup@v6
        with:
          version: '12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 将已归一化的版本号写入 package.json，tauri.conf.json 引用它作为应用版本
      - name: Sync app version from tag
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      # 打包前的最后一道闸：确认 tauri.conf.json 实际读取到的版本就是归一化版本，
      # 防止 v/vv 前缀或意外改写混入安装包、dmg 与应用内显示的版本号
      - name: Verify app version
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          SYNCED=$(node -p "require('./package.json').version")
          if [ "$SYNCED" != "$VERSION" ]; then
            echo "::error::package.json 版本 '${SYNCED}' 与归一化版本 '${VERSION}' 不一致"
            exit 1
          fi
          echo "待打包的应用版本：${SYNCED}"

      - name: Frontend typecheck
        run: pnpm build

      # Windows：NSIS 安装版 + 便携 exe（现状不变）
      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm tauri build --bundles nsis

      # macOS：arm64 dmg + .app
      # 必须同时指定 app：只构建 dmg 时 Tauri 会把中间产物 .app 清理掉，
      # 导致后续打包 .app.zip 找不到目录
      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --bundles app,dmg --target aarch64-apple-darwin

      # Windows 资产：NSIS 安装包 + 便携 exe
      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = "${{ needs.validate.outputs.tag }}"  # 例如 v1.0.0
          $targetRoot = 'src-tauri/target/release'

          # 1) NSIS 安装包
          $nsis = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/nsis') -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) {
            throw 'No Windows NSIS installer found'
          }
          $installerDest = "68Proxy-$VERSION-Windows-x64-setup.exe"
          Copy-Item $nsis.FullName (Join-Path release-assets $installerDest)
          Write-Host "Installer copied: $installerDest"

          # 2) 便携版 exe（Tauri 便携版由 exe + portable.ini 组成，打包为 zip）
          $exePath = Join-Path $targetRoot '68Proxy.exe'
          if (-not (Test-Path $exePath)) {
            throw "Portable exe not found: $exePath"
          }
          $portableDir = 'release-assets/68Proxy-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# 68Proxy portable build marker', 'portable=true') | Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          # 压缩包必须落在 release-assets/ 内，否则会被后续 path: release-assets/* 漏掉
          $portableZip = "68Proxy-$VERSION-Windows-x64-Portable.zip"
          $portableZipPath = Join-Path 'release-assets' $portableZip
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portableZipPath -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Windows portable zip created: $portableZipPath"

          # 兜底校验：上传步骤只按目录收集，若产物写错位置会静默漏发（历史故障），
          # 这里显式确认两个 Windows 资产都已就位
          foreach ($asset in @($installerDest, $portableZip)) {
            if (-not (Test-Path (Join-Path 'release-assets' $asset))) {
              throw "Expected asset missing from release-assets: $asset"
            }
          }

      # macOS 资产：dmg 镜像 + .app 压缩包
      # 两者内容相同（同一构建产物的两种封装）：dmg 面向常规安装，.app zip 免挂载
      # 磁盘映像，便于脚本分发与自动化部署
      - name: Prepare macOS Assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${{ needs.validate.outputs.tag }}"  # 例如 v1.0.0
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"

          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1 || true)
          if [ -n "$DMG" ]; then
            NEW_DMG="68Proxy-${VERSION}-macOS-aarch64.dmg"
            cp "$DMG" "release-assets/$NEW_DMG"
            echo "✅ DMG copied: $NEW_DMG"
          else
            echo "No DMG found under $BUNDLE_DIR/dmg" >&2
            exit 1
          fi

          # .app 目录（dmg 同一构建产物）；--keepParent 让 zip 顶层就是 .app 本身，
          # 解压后可直接拖入「应用程序」；-k 生成 zip，--sequesterRsrc 保留扩展属性
          APP=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app" | head -1 || true)
          if [ -n "$APP" ]; then
            NEW_APP_ZIP="68Proxy-${VERSION}-macOS-aarch64.app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/$NEW_APP_ZIP"
            echo "✅ app zip created: $NEW_APP_ZIP"
          else
            echo "No .app found under $BUNDLE_DIR/macos" >&2
            exit 1
          fi

      - name: List prepared assets
        shell: bash
        run: ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, release]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      # 发版说明优先取 release-notes/{tag}.md（该版本专属），否则回退到
      # release-notes/default.md 通用模板；两者都用 {{TAG}} / {{REPO}} 占位符，
      # 在此统一替换。正文从工作流内联字符串搬到模板文件，避免大量 echo 转义出错；
      # 模板正文会被原样写入，故不要在其中使用 HTML 注释
      - name: Load release notes
        id: release_notes
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="release-notes/${TAG}.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="release-notes/default.md"
          fi
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::缺少发版说明模板：release-notes/${TAG}.md 与 release-notes/default.md 均不存在"
            exit 1
          fi

          # 先替换占位符再写入 output；用 heredoc 保留多行与 Markdown 原样
          BODY=$(sed -e "s|{{TAG}}|${TAG}|g" -e "s|{{REPO}}|${REPO}|g" "$NOTES_FILE")
          {
            echo 'body<<__RELEASE_NOTES__'
            printf '%s\n' "$BODY"
            echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"
          echo "使用发版说明模板：${NOTES_FILE}"

      - name: List downloaded release artifacts
        shell: bash
        run: ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ needs.validate.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
