<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="200" viewBox="0 0 1200 200"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">68Proxy — Command Code 协议转换网关</title>
  <desc id="hero-desc">68Proxy turns the private Command Code API into OpenAI &amp; Anthropic compatible endpoints.</desc>
  <defs>
    <linearGradient id="hero-ic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="hero-ic-glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .bg { fill: #ffffff; stroke: #e2e8f0; }
    .title { fill: #18181b; }
    .sub { fill: #475569; }
    .sub2 { fill: #94a3b8; }
    .water { fill: #18181b; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #18181b; stroke: #2f2f2f; }
      .title { fill: #fafafa; }
      .sub { fill: #a1a1aa; }
      .sub2 { fill: #71717a; }
      .water { fill: #ffffff; }
    }
  </style>
  <rect class="bg" width="1200" height="200" rx="16" stroke-width="1"/>

  <!-- 右侧背景水印 -->
  <text class="water" x="1005" y="130" text-anchor="middle" opacity="0.045"
        font-family="Bahnschrift,'Segoe UI',Arial,sans-serif" font-size="230" font-weight="700" letter-spacing="-8">68</text>

  <!-- 左侧：应用实际图标（src-tauri/icons/icon-source.svg，内联矢量） -->
  <g transform="translate(56 46) scale(0.08203125)">
    <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#hero-ic-bg)"/>
    <rect x="7" y="7" width="1010" height="1010" rx="193" fill="none" stroke="#2f2f2f" stroke-width="14"/>
    <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#hero-ic-glow)"/>
    <circle cx="512" cy="512" r="356" fill="none" stroke="#212121" stroke-width="10"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#1a1a1a" stroke-width="8"/>
    <text x="512" y="738" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif" font-weight="700" font-size="600" fill="#fafafa" text-anchor="middle" letter-spacing="-10">68</text>
    <line x1="250" y1="960" x2="774" y2="960" stroke="#f5a524" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
    <circle cx="250" cy="960" r="28" fill="#fafafa"/>
    <circle cx="774" cy="960" r="28" fill="#fafafa"/>
    <circle cx="806" cy="220" r="56" fill="none" stroke="#f5a524" stroke-width="8" opacity="0.35"/>
    <circle cx="806" cy="220" r="38" fill="#f5a524"/>
  </g>

  <!-- 标题与副标题 -->
  <text class="title" x="164" y="84" font-family="Bahnschrift,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="1">68Proxy</text>
  <text class="sub" x="166" y="110" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" letter-spacing="0.5">Command Code 本地反向代理 · 协议转换网关</text>
  <text class="sub2" x="166" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5">Turn the private Command Code API into OpenAI &amp; Anthropic compatible endpoints</text>

  <!-- 技术栈徽章（文字垂直水平居中） -->
  <g transform="translate(0 150)">
    <rect x="166"  y="0" width="76" height="24" rx="12" fill="#ff7a1a"/>
    <text x="204"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Tauri 2</text>
    <rect x="248"  y="0" width="54" height="24" rx="12" fill="#DEA584"/>
    <text x="275"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Rust</text>
    <rect x="308"  y="0" width="62" height="24" rx="12" fill="#61DAFB"/>
    <text x="339"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#1a1a2e">React</text>
    <rect x="376"  y="0" width="84" height="24" rx="12" fill="#3178C6"/>
    <text x="418"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">TypeScript</text>
    <rect x="466"  y="0" width="48" height="24" rx="12" fill="#646CFF"/>
    <text x="490"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Vite</text>
    <rect x="520"  y="0" width="76" height="24" rx="12" fill="#0F766E"/>
    <text x="558"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Tailwind</text>
    <rect x="602"  y="0" width="54" height="24" rx="12" fill="#6A5ACD"/>
    <text x="629"  y="12" dominant-baseline="central" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">axum</text>
  </g>
</svg>
