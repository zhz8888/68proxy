<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.62">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#bg)"/>
  <rect x="7" y="7" width="1010" height="1010" rx="193" fill="none" stroke="#2f2f2f" stroke-width="14"/>

  <!-- 背景：琥珀辉光 + 中继环 -->
  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="356" fill="none" stroke="#212121" stroke-width="10"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#1a1a1a" stroke-width="8"/>

  <!-- 68 主体：Bahnschrift 粗体大字号 -->
  <text x="512" y="738"
        font-family="Bahnschrift, Segoe UI, Arial, Helvetica, sans-serif"
        font-weight="700" font-size="600" fill="#fafafa"
        text-anchor="middle" letter-spacing="-10">68</text>

  <!-- 底部中继轨道：琥珀链路 + 两端白色节点 -->
  <line x1="250" y1="960" x2="774" y2="960" stroke="#f5a524" stroke-width="18" stroke-linecap="round" opacity="0.9"/>
  <circle cx="250" cy="960" r="28" fill="#fafafa"/>
  <circle cx="774" cy="960" r="28" fill="#fafafa"/>

  <!-- 右上角信号灯 + 光晕 -->
  <circle cx="806" cy="220" r="56" fill="none" stroke="#f5a524" stroke-width="8" opacity="0.35"/>
  <circle cx="806" cy="220" r="38" fill="#f5a524"/>
</svg>
